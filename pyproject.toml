[project]
name = "identity-service"
version = "0.1.2"
description = ""
authors = [{ name = "MLE Slone", email = "m.slone@gmail.com" }]
requires-python = "~=3.13"
readme = "README.md"
dependencies = [
    "django>=5.1.2,<6",
    "djangorestframework>=3.15.2,<4",
    "djangorestframework-simplejwt>=5.3.1,<6",
    "cryptography>=43.0.3,<44",
    "noid-minter>=0.1.1,<0.2",
    "dotenv>=0.9.9",
    "psycopg[binary]>=3.2.9",
    "django-postgres-copy>=2.8.0",
    "django-extensions>=4.1",
    "gunicorn>=23.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3,<9",
    "black>=24.10.0,<25",
    "pytest-django>=4.9.0,<5",
    "requests>=2.32.3,<3",
    "pytest-watcher>=0.4.3,<0.5",
    "pyinstrument>=5.0.2",
]

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "identity"
module-root = ""

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "identity.settings"
python_files = ["test_*.py", "*_test.py", "testing/python/*.py"]
