[project]
name = "identity-service"
version = "0.1.0"
description = ""
authors = [{ name = "MLE Slone", email = "m.slone@gmail.com" }]
requires-python = "~=3.13"
readme = "README.md"
dependencies = [
    "django>=5.1.2,<6",
    "djangorestframework>=3.15.2,<4",
    "djangorestframework-simplejwt>=5.3.1,<6",
    "cryptography>=43.0.3,<44",
    "noid-minter>=0.1.1,<0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3,<9",
    "black>=24.10.0,<25",
    "pytest-django>=4.9.0,<5",
    "requests>=2.32.3,<3",
    "pytest-watcher>=0.4.3,<0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "identity.settings"
python_files = ["test_*.py", "*_test.py", "testing/python/*.py"]

[tool.hatch.build.targets.wheel]
packages = ["identity"]
