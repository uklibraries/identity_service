services:
  web:
    build: .
    networks:
      - app-network
    command: uv run manage.py runserver 0.0.0.0:8000
    container_name: ukl-identity-dj
    ports:
      - 8000:8000
    volumes:
      - identity:/app
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/

        - action: rebuild
          path : ./pyproject.toml
    depends_on:
      - migration
      - db
    env_file:
      - ./.env

  migration:
    build: .
    networks:
      - app-network
    command: uv run manage.py migrate --noinput
    volumes:
      - identity:/app
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - ./.env

  db:
    image: postgres:17-bookworm
    container_name: postgres_db
    networks:
      - app-network
    volumes:
      - postgres_db:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

volumes:
  identity:
  postgres_db:

networks:
  app-network:
    driver: bridge
